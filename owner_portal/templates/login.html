{% extends 'layout.html' %}
{% block content %}
<section class="welcome">
  <div class="home-icon" aria-hidden="true">⌂</div>
  <p class="eyebrow">WELCOME HOME</p>
  <h1>Your homes.<br>A clearer picture.</h1>
  <p>Sign in with the Google account on your owner invitation.</p>
  <p id="login-error" class="error" role="alert" {% if not error %}hidden{% endif %}>{{ error or '' }}</p>
  <p id="invite-status" role="status" hidden></p>
  <form action="/auth/google" method="post" id="google-form">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <button id="google-button">Continue with Google <span aria-hidden="true">→</span></button>
  </form>
  <small>Access is by invitation from your property management team.</small>
</section>
{% endblock %}
