# Include inside the existing HTTPS server for yourcottoncandy.com.
location = /owners {
    access_log /var/log/nginx/owner-portal-access.log owner_portal;
    return 308 /owners/;
}
location ^~ /owners/auth/ {
    limit_req zone=owner_portal_auth burst=10 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/owner-portal-proxy.conf;
}
location ^~ /owners/ {
    include /etc/nginx/snippets/owner-portal-proxy.conf;
}
